      - "cmd: ./gradlew :app:connectedDebugAndroidTest"
      - "manual: Test cases explicitly cover paste/rebind/focus-cycle idempotence for percent fields."
      - "manual: Test cases verify estimate block visibility and value consistency after state restore."
