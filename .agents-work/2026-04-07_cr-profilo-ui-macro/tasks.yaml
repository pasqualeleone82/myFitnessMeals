project:
  name: "CR profilo UI macro fixes"
  definition_of_done:
    - "CI green"
    - "AC met"
    - "README updated"

tasks:
  - id: meta
    status: completed
    type: fix
    title: "Critical hotfix: bottom bar tab interactions and settings label wrapping"
    depends_on: []
    goal: "Fix tab click reactivity regression, keep settings tab label single-line, and move quick-add action inline with bottom tabs."
    non_goals:
      - "Changing dashboard/meal/history/settings business logic"
      - "Altering profile calorie logic"
      - "Broad UI redesign"
    context_files:
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/spec.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/tasks.yaml"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/architecture.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/design-specs/design-spec-profile-fab-macro.md"
    files_expected:
      - "app/src/main/java/com/myfitnessmeals/app/MainActivity.kt"
      - "app/src/androidTest/java/com/myfitnessmeals/app/main/MainFabAlignmentUiTest.kt"
      - "app/src/androidTest/java/com/myfitnessmeals/app/main/MainTabNavigationUiTest.kt"
    acceptance_checks:
      - "cmd: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.myfitnessmeals.app.dashboard.DashboardHistoryFlowSmokeTest,com.myfitnessmeals.app.settings.SettingsThemePreferenceSmokeTest,com.myfitnessmeals.app.settings.GarminSettingsFlowSmokeTest"
      - "cmd: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.myfitnessmeals.app.main.MainFabAlignmentUiTest"
      - "manual: in app, tab clicks change screen again"
      - "manual: settings label stays on one line"
    risk_flags:
      - "breaking-change"
    done_when:
      - "Bottom tabs are responsive and navigate correctly"
      - "Center quick-add action is inline with tab icons"
      - "Settings label remains one line"

  - id: T-001
    status: completed
    type: feat
    title: "Expose and persist profile calorie estimate in onboarding"
    depends_on: []
    goal: "Render a clear onboarding calorie estimate block, keep estimate reactive to profile inputs, and persist the same computed target on submit."
    non_goals:
      - "Changing GoalComputationService formulas"
      - "Adding new required profile fields"
      - "Redesigning onboarding layout outside estimate emphasis"
    context_files:
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/spec.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/architecture.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/design-specs/design-spec-profile-fab-macro.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/acceptance.json"
    files_expected:
      - "app/src/main/java/com/myfitnessmeals/app/ui/onboarding/OnboardingRoute.kt"
      - "app/src/main/java/com/myfitnessmeals/app/ui/onboarding/OnboardingViewModel.kt"
      - "app/src/main/res/values/strings.xml"
      - "app/src/main/res/values-it/strings.xml"
    acceptance_checks:
      - "cmd: ./gradlew :app:testDebugUnitTest"
      - "manual: In onboarding with valid profile inputs, estimate is visible before primary CTA with kcal/day (kcal/giorno in Italian resources)."
      - "manual: Changing profile values updates estimate without refresh action."
      - "manual: After complete onboarding, persisted target matches last displayed estimate."
      - "manual: After process recreation or screen restore, estimate remains coherent with current state."
    risk_flags:
      - "none"
    done_when:
      - "No onboarding regression outside profile estimate display behavior"
      - "Estimate visible state and placeholder state both implemented"
      - "Meets AC-001 and AC-004"

  - id: T-002
    status: completed
    type: fix
    title: "Correct center FAB optical and geometric alignment"
    depends_on: []
    goal: "Adjust scaffold constants and slot layout so center FAB aligns with viewport center and bottom-nav gap across common phone sizes."
    non_goals:
      - "Changing bottom navigation information architecture"
      - "Changing FAB action semantics"
      - "Adding new animation patterns"
    context_files:
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/spec.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/architecture.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/design-specs/design-spec-profile-fab-macro.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/acceptance.json"
    files_expected:
      - "app/src/main/java/com/myfitnessmeals/app/MainActivity.kt"
      - "app/src/main/res/values/dimens.xml"
    acceptance_checks:
      - "cmd: ./gradlew :app:assembleDebug"
      - "manual: On 320dp, 360dp, 411dp widths and landscape phone, FAB is centered and not clipped."
      - "manual: FAB center visually matches nav gap center; no overlap blocks nav labels/icons."
      - "manual: FAB touch target remains at least 48dp."
    risk_flags:
      - "none"
    done_when:
      - "Scaffold/FAB alignment constants are consolidated in one place"
      - "No navigation behavior regressions"
      - "Meets AC-002"

  - id: T-003
    status: in-progress
    type: fix
    title: "Remove duplicated percent-symbol behavior in macro fields"
    depends_on: []
    goal: "Enforce numeric canonical input and idempotent single-% presentation for onboarding/settings macro fields in all interaction states."
    non_goals:
      - "Changing macro sum business rule (must total 100)"
      - "Persisting display symbols in repository"
      - "Rewriting settings or onboarding screen structure"
    context_files:
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/spec.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/architecture.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/design-specs/design-spec-profile-fab-macro.md"
      - ".agents-work/2026-04-07_cr-profilo-ui-macro/acceptance.json"
    files_expected:
      - "app/src/main/java/com/myfitnessmeals/app/ui/common/input/PercentFieldFormatter.kt"
      - "app/src/main/java/com/myfitnessmeals/app/ui/onboarding/OnboardingRoute.kt"
      - "app/src/main/java/com/myfitnessmeals/app/ui/settings/SettingsRoute.kt"
      - "app/src/main/res/values/strings.xml"
      - "app/src/main/res/values-it/strings.xml"
    acceptance_checks:
      - "cmd: ./gradlew :app:testDebugUnitTest"
      - "manual: Typing, pasting (including 40%, 40%%), focus changes, and recomposition never produce duplicated % in macro fields."
      - "manual: Prefilled values from persisted state (numeric or legacy suffixed) normalize to a single-% visual representation."
      - "manual: Empty and zero macro values behave correctly without forced duplicated symbols."
    risk_flags:
      - "none"
    done_when:
      - "A single source-of-truth formatting strategy is applied to onboarding and settings macro fields"
      - "Parsing/storage paths remain numeric-only"
      - "Meets AC-003 and AC-006"

