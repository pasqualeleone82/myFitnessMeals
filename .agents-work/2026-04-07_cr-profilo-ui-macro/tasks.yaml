      - "app/src/test/java/com/myfitnessmeals/app/ui/onboarding/OnboardingViewModelTest.kt"
      - "app/src/androidTest/java/com/myfitnessmeals/app/ui/onboarding/OnboardingEstimateUiTest.kt"
      - "app/src/androidTest/java/com/myfitnessmeals/app/ui/settings/MacroPercentUiTest.kt"
