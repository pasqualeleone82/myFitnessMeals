    type: refactor
    title: "Extend Room entities and add migration for enriched nutrients"
    size: M
    depends_on: []
    goal: "Add additive DB schema changes for all enriched nutrients in food, meal entry, override, and daily summary tables with safe migration and null-safe defaults."
    non_goals:
      - "Implement History UI"
      - "Change business logic beyond schema compatibility"
    context_files:
      - ".agents-work/2026-04-13_history-nutrients-navigation/spec.md"
      - ".agents-work/2026-04-13_history-nutrients-navigation/architecture.md"
      - ".agents-work/2026-04-13_history-nutrients-navigation/acceptance.json"
    files_expected:
      - "app/src/main/java/com/myfitnessmeals/app/data/local/entity/FoodItemEntity.kt"
      - "app/src/main/java/com/myfitnessmeals/app/data/local/entity/MealEntryEntity.kt"
