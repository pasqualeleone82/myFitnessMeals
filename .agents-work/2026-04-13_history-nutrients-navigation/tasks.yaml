      - "app/src/main/java/com/myfitnessmeals/app/data/local/AppDatabase.kt"
      - "app/src/test/java/**/Migration*Test.kt"
    acceptance_checks:
      - "cmd: ./gradlew :app:testDebugUnitTest --tests '*Migration*'"
      - "manual: Upgrade existing local DB and verify no startup crash/data loss (AC-013)"
      - "manual: Existing rows keep prior values; new nutrient columns nullable/0-safe on read (AC-014)"
